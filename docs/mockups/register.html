<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>!function(){var t=localStorage.getItem('mascot-theme');if(t&&t!=='catdog')document.documentElement.setAttribute('data-theme',t)}();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7eb3" />
  <title>注册 — 柒梦的小破站</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-page">
    <a href="login.html" class="login-back" aria-label="返回登录">
      <span>←</span><span>返回登录</span>
    </a>
    <a href="settings.html" class="login-settings-link" aria-label="个人设置">⚙️ 外观</a>
    <span class="login-prototype-tag">UI 原型 · 注册</span>

    <div class="login-shell">
      <aside class="login-brand" aria-hidden="true">
        <div class="login-brand-inner">
          <div class="login-brand-logo">
            <div class="logo-mascot" data-theme-logo>🐱</div>
            <div class="login-brand-logo-text">
              <strong data-theme-text="brand">柒梦的小破站</strong>
              <span data-theme-text="tagline">毛茸茸的智能小助手</span>
            </div>
          </div>
          <h2 data-theme-text="loginHero" data-theme-html="true">和小伙伴一起<br />愉快地使用 AI 喵～</h2>
          <p data-theme-text="loginHeroDesc">聊天、写文档、问技术、看图片——注册登录就能用。</p>
        </div>
      </aside>

      <main class="login-form-panel">
        <div class="login-card">
          <div class="login-card-body">
            <h1 data-theme-text="registerTitle">加入喵汪大家庭～</h1>
            <p class="subtitle" data-theme-text="registerSubtitle">注册后默认普通用户，开箱即用</p>

            <form action="chat.html" method="get">
              <div class="input-group">
                <label class="label" for="username">账号</label>
                <input class="input" type="text" id="username" name="username" placeholder="取一个账号名" autocomplete="username" required />
              </div>
              <div class="input-group">
                <label class="label" for="password">密码</label>
                <input class="input" type="password" id="password" name="password" placeholder="至少 6 位" required />
              </div>
              <div class="input-group">
                <label class="label" for="confirm">确认密码</label>
                <input class="input" type="password" id="confirm" name="confirm" placeholder="再次输入密码" required />
              </div>
              <button type="submit" class="btn btn-primary login-submit" data-theme-text="registerSubmit">🐾 注册</button>
            </form>

            <div class="login-footer">
              <p>
                <span data-theme-text="registerFooterPrompt">已有账号？</span>
                <a href="login.html">去登录</a>
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="themes.js"></script>
</body>
</html>
